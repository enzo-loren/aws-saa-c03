name: Audiolibro SAA-C03

on:
  push:
    branches:
      - audiolibro-completo
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: audiolibro-completo
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r audiolibro/requirements.txt
      - name: Integrity gate PRE - verify source and build immutable archive
        run: python audiolibro/integrity_gate.py pre --out dist
      - name: Generate narrated course and full PDF
        run: python audiolibro/build.py --out dist
      - name: Validate narration, quiz fidelity, and spoken-only PDF
        run: python audiolibro/validate_exam_addendum.py dist
      - name: Integrity gate POST - embed originals and visual evidence
        run: python audiolibro/integrity_gate.py post --out dist
      - name: Upload download package
        uses: actions/upload-artifact@v4
        with:
          name: SAA-C03-Audiolibro
          path: dist/
          retention-days: 90
          compression-level: 6
      - name: Publish downloadable release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="audiolibro-saa-c03"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --title "SAA-C03 - Audiolibro completo" --notes "PDF de lectura con repaso, fuentes documentales y reporte de cobertura. Generado desde la rama audiolibro-completo."
          fi
          gh release upload "$tag" \
            dist/SAA-C03-Audiolibro-COMPLETO.pdf \
            dist/SAA-C03-Audiolibro-Curso.pdf \
            dist/SAA-C03-SOLO-ESCUCHAR.pdf \
            dist/SAA-C03-SOLO-ESCUCHAR.txt \
            dist/SAA-C03-Repaso-Espaciado.pdf \
            dist/SAA-C03-Repaso-Espaciado.txt \
            dist/SAA-C03-Capitulos-REPASO-TTS.zip \
            dist/SAA-C03-Audiolibro-BASE-TEXTUAL.txt \
            dist/AUDITORIA-ESCUCHA.json \
            dist/SAA-C03-Audiolibro-COMPLETO.txt \
            dist/SAA-C03-Audiolibro-Curso.txt \
            dist/SAA-C03-Capitulos-TTS.zip \
            dist/SAA-C03-ORIGINALES-EXACTOS.zip \
            dist/PRUEBA-INTEGRIDAD.json \
            dist/SAA-C03-ANEXO-DIAGRAMAS.pdf \
            dist/SAA-C03-TRANSCRIPCION-LITERAL-SILVER.txt \
            dist/SAA-C03-DIAGRAMAS-NARRABLES.txt \
            dist/AUDITORIA.json --clobber
